[project]
name = "sepsis"
version = "0.1.0"
description = "Hourly sepsis early-warning model on PhysioNet 2019, built on Amazon SageMaker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6",
    "boto3>=1.35",
    # SageMaker Python SDK v3 (modular, not compatible with v2). Pinned exactly.
    "sagemaker==3.25.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "xgboost>=3.2.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
tracking = [
    "mlflow>=3.17.1",
    "sagemaker-mlflow>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sepsis"]

[tool.ruff]
line-length = 100
# Vendored upstream code is kept byte-for-byte; never lint or reformat it.
extend-exclude = ["third_party"]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
